<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cloning amazon cart </title>

    <style>
        .back-button {
            background-color: white;
            color: rgb(0, 113, 133);
            border: none;
            text-decoration: underline;
        }
        .add-cart {
            background-color: rgb(255, 216, 20);
            border: none;
            height: 18px;
            width: 80px;
            border-radius: 9px;
            margin: 3px;
        }
        .buy-now {
            background-color: rgb(255, 164, 28);
            border: none;
            height: 18px;
            width: 80px;
            border-radius: 9px;
        }
        .p1 {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button class="back-button">
        Back to Amazon
    </button>
    <h1>
        Nike Black Running shoes
    </h1>
    <p class="p1">
        $39 - in stock.
    </p>
    <p>
        Free delivery tomorrow
    </p>
    <button class = "add-cart">Add to Cart</button>
    <button class = "buy-now">BUY NOW</button>
</body>
</html>
